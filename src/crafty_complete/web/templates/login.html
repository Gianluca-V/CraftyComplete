<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>craftyComplete — Log in</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body class="login-body">
  <main class="login-card">
    <h1 class="brand">crafty<span>Complete</span></h1>
    <p class="login-hint">Log in with your Crafty Controller account.</p>
    <form id="login-form" novalidate>
      <label class="field">
        Username
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label class="field">
        Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <label class="field">
        2FA code <span class="optional">(only if enabled in Crafty)</span>
        <input name="totp" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]{6}" maxlength="6">
      </label>
      <p id="login-error" class="status is-error" role="alert"></p>
      <button type="submit" class="primary">Log in</button>
    </form>
    <p class="version">v{{ version }}</p>
  </main>
  <script src="{{ url_for('static', path='login.js') }}"></script>
</body>
</html>
